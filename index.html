<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./calulo.js" defer></script>
    <link rel="stylesheet" href="./style.css">
    <title>Calculadora Simples</title>
</head>
<body>
    <input id="numero-digitado" type="text" placeholder="Digite o primeiro valor">
    <input id="numero-digitado-dois" type="text" placeholder="Digite o segundo valor">
    <button id="soma">+</button>
    <button id="subtracao">-</button>
    <button id="multiplicacao">x</button>
    <button id="divisao">/</button>
    <hr>
    <div id="resultado"></div>
</body>
</html>
